# /etc/reclockd.conf — konfiguracja daemona reclockd v4 (polityka Etap 3)
# Kopiuj: sudo cp reclockd.conf /etc/reclockd.conf
#
# Lista class-ów aplikacji "preferred" (hyprctl activewindow/clients .class).
# Preferred = apka z tej listy FOCUSED LUB (RUNNING + busy > busy-up).
# Tu: przeglądarki. NIGDY foot/terminal (terminal → default = cap 07).

[preferred]
chromium
firefox
google-chrome
brave

[profile default]
# Apka non-preferred (terminal, edytor): cap 07, twardy throttle.
# Thermal PER-PROFIL — konserwatywny: powyżej 65°C zwalnia, odzysk poniżej 58°C.
max-pstate = 07
temp-down = 65
temp-up = 58

[profile preferred]
# Apka preferred (przeglądarki): bezpieczna drabinka 07↔0a↔0e (cap 0e).
# 0f = BOOST TIER nad drabinką (NIE w LADDER). Wchodzi z 0e tylko gdy:
#   busy > busy-boost (85%) przez boost-dwell (5 s) AND temp < temp-up (75°C).
# Straż termiczna 0f (priorytet nad loadem): temp > 75°C LUB temp >= 82°C
#   → NATYCHMIAST drop z 0f do 0e. Wyjście loadowe: busy < busy-up (80%).
# Thermal preferred: powyżej 82°C zwalnia (drabinka), odzysk poniżej 75°C.
max-pstate = 0e
temp-down = 82
temp-up = 75
boost-pstate = 0f
busy-boost = 85
boost-dwell-ms = 5000

# Parametry ogólne (nadpisują wbudowane defaulty). Histereza load 80/40 (40 pp).
[global]
interval-ms = 200
poll-ms = 1000
busy-up = 80
busy-down = 40
temp-dwell-ms = 5000
idle-dwell-ms = 5000
profile-dwell-ms = 2000
win-ms = 1000
exit-state = 0a